<div class="table-scroll">
  <table mat-table [dataSource]="[]">
    <ng-container matColumnDef="number">
      <th mat-header-cell *matHeaderCellDef>№</th>
      <td mat-cell *matCellDef="let row"></td>
    </ng-container>
    <ng-container matColumnDef="counterparty">
      <th mat-header-cell *matHeaderCellDef>Контрагент</th>
      <td mat-cell *matCellDef="let row"></td>
    </ng-container>
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Сума</th>
      <td mat-cell *matCellDef="let row"></td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Статус</th>
      <td mat-cell *matCellDef="let row"></td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>

<mat-paginator [length]="0" [pageSize]="20" [hidePageSize]="true" />
