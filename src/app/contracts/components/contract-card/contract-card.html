@if (store.selectedId() === null) {
  <app-empty-state text="Оберіть договір зі списку" />
} @else if (store.contract(); as c) {
  <h2>
    Договір № {{ c.number }} <span class="status">{{ c.status | statusLabel }}</span>
  </h2>

  <form class="card-form">
    <mat-form-field>
      <mat-label>Контрагент</mat-label>
      <input matInput [value]="c.counterparty" disabled />
    </mat-form-field>

    <div class="row">
      <mat-form-field class="amount">
        <mat-label>Сума (з ПДВ)</mat-label>
        <input matInput type="text" inputmode="decimal" [value]="c.amount" disabled />
      </mat-form-field>
      <mat-form-field class="currency">
        <mat-label>Валюта</mat-label>
        <mat-select [value]="c.currency" disabled>
          <mat-option value="UAH">UAH</mat-option>
          <mat-option value="USD">USD</mat-option>
          <mat-option value="EUR">EUR</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-checkbox [checked]="c.vatPayer" disabled>Платник ПДВ</mat-checkbox>

    <app-contract-calc />

    <div class="row">
      <mat-form-field>
        <mat-label>Дата підписання</mat-label>
        <input matInput [matDatepicker]="signPicker" [value]="dates()?.sign" readonly disabled />
        <mat-datepicker #signPicker />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Діє з</mat-label>
        <input matInput [matDatepicker]="startPicker" [value]="dates()?.start" readonly disabled />
        <mat-datepicker #startPicker />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Діє по</mat-label>
        <input matInput [matDatepicker]="endPicker" [value]="dates()?.end" readonly disabled />
        <mat-datepicker #endPicker />
      </mat-form-field>
    </div>

    <mat-form-field>
      <mat-label>Коментар</mat-label>
      <textarea matInput rows="3" [value]="c.comment ?? ''" disabled></textarea>
    </mat-form-field>

    @if (store.statusEditable()) {
      <div class="actions">
        <button mat-flat-button type="button" [disabled]="!store.canEdit()">
          Надіслати на погодження
        </button>
      </div>
    }
  </form>
} @else {
  <mat-progress-bar mode="indeterminate" />
}
